<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Symptom and Medication Tracking</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>
  <main class="page">
    <header>
      <h1>Symptom and Medication Tracking</h1>

      <p class="subtitle">
        Daily observations over time
      </p>
    </header>

    <!-- FIRST CHART: SYMPTOMS -->
    <section class="chart-section">
      <div class="chart-heading">
        <div>
          <h2>Symptoms</h2>

          <p>
            Daily ratings on a scale from 0 to 5
          </p>
        </div>

        <div class="period-key">
          <span class="period-key-box"></span>
          Period
        </div>
      </div>

      <div id="symptom-legend" class="legend"></div>

      <div
        id="symptom-chart"
        class="chart-container"
      ></div>

      <p class="scale-note">
        0 = none or minimal; 5 = most severe
      </p>
    </section>

    <!-- SECOND CHART: MEDICATION -->
    <section class="chart-section medication-section">
      <div class="chart-heading">
        <div>
          <h2>Medication</h2>

          <p>
            Medication changes and doses over time
          </p>
        </div>
      </div>

      <div class="chart-placeholder">
        Medication chart will be added here.
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip"></div>

  <script src="chart.js"></script>
</body>
</html>
